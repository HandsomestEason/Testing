name: Deploy with Approval Gate

on:
  push:
    branches:
      - main
  workflow_dispatch:   # allows manual trigger from GitHub UI

jobs:
  # ─────────────────────────────────────────
  # JOB 1: Build & Test
  # Runs automatically, no approval needed
  # ─────────────────────────────────────────
  build:
    name: 🔨 Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          echo "Installing dependencies..."
          # npm ci  ← uncomment for real projects

      - name: Run tests
        run: |
          echo "Running tests..."
          # npm test  ← uncomment for real projects

      - name: Build
        run: |
          echo "Building application..."
          # npm run build  ← uncomment for real projects

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: .          # change to your build folder e.g. ./dist
          retention-days: 1

  # ─────────────────────────────────────────
  # JOB 2: Deploy
  # ⏸ PAUSES here and waits for manual approval
  # Configure approvers under:
  #   Repo Settings → Environments → production → Required reviewers
  # ─────────────────────────────────────────
  deploy:
    name: 🚀 Deploy to Production
    runs-on: ubuntu-latest
    needs: build                  # only runs after build succeeds
    environment: production       # 👈 THIS triggers the approval gate

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-output

      - name: Show deployer info
        run: |
          echo "✅ Approved! Starting deployment..."
          echo "Triggered by : ${{ github.actor }}"
          echo "Branch       : ${{ github.ref_name }}"
          echo "Commit SHA   : ${{ github.sha }}"
          echo "Run ID       : ${{ github.run_id }}"

      - name: Deploy to cloud
        run: |
          echo "Deploying to production..."
          # Replace this block with your actual deploy command, e.g.:
          # AWS:    aws s3 sync ./dist s3://your-bucket
          # GCP:    gcloud app deploy
          # Azure:  az webapp deploy ...
          # SSH:    ssh user@host 'bash deploy.sh'
          echo "Deployment complete! 🎉"

      - name: Post-deploy health check
        run: |
          echo "Running health check..."
          # curl -f https://your-app-url.com/health || exit 1
          echo "Health check passed ✅"